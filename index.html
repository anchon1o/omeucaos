<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="O meu caos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icona-192.png">
<title>O meu caos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--fondo:#F2F4F3;--superficie:#FFFFFF;--tinta:#1D2B2F;--suave:#5F6F73;--linha:#D9E0DF;--acento:#2E5E7E;--perigo:#B23A3A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#121A1C;--superficie:#1A2427;--tinta:#E4EBEA;--suave:#9AA9AC;--linha:#2B383B;--acento:#86B6D6;--perigo:#E58787;color-scheme:dark}}
:root[data-theme="dark"]{--fondo:#121A1C;--superficie:#1A2427;--tinta:#E4EBEA;--suave:#9AA9AC;--linha:#2B383B;--acento:#86B6D6;--perigo:#E58787;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:1.0625rem/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;min-height:100%;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;padding:8px 18px calc(120px + env(safe-area-inset-bottom,0px))}
header.cab{max-width:720px;margin:0 auto;padding:14px 18px 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.marca{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.cab .data{color:var(--suave);flex:1}
.sync{font-size:.82rem;color:var(--suave);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--suave);display:inline-block}
.sync.ok i{background:#3C8A55}.sync.gardando i{background:#C2861F}.sync.erro i{background:var(--perigo)}
h3{font-size:1.05rem;margin:28px 0 8px;font-weight:700}
.vacio{color:var(--suave);margin:6px 0}
.pequeno{font-size:.9rem;color:var(--suave)}
/* navegación de días */
.navdia{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.navdia .etq{flex:1;text-align:center;font-weight:700}
.navdia .btn{min-width:44px;font-size:1.2rem;line-height:1}
/* Agora */
.agora{--c:var(--acento);background:color-mix(in srgb,var(--c) 13%,var(--superficie));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);border-radius:22px;padding:20px 20px 16px}
.agora .cat{display:flex;align-items:center;gap:8px;color:var(--suave);font-size:.92rem}
.punto{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.agora h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:clamp(2rem,8.5vw,2.9rem);line-height:1.04;margin:.25em 0 .35em;letter-spacing:-.015em}
.agora p{margin:0 0 12px}
.progreso{height:7px;background:color-mix(in srgb,var(--c,var(--acento)) 22%,transparent);border-radius:4px;overflow:hidden}
.progreso i{display:block;height:100%;background:var(--c,var(--acento))}
.despois{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--c) 25%,transparent);color:var(--suave)}
.despois b{color:var(--tinta)}
.agora .fila{margin-top:14px}
.agora .btn{background:color-mix(in srgb,var(--c) 8%,var(--superficie))}
.agora .btn.primario{background:var(--c);border-color:var(--c);color:#fff}
.anticipo{margin:12px 2px 0;color:var(--suave)}
.nota-caixa{background:var(--superficie);border:1px solid var(--linha);border-left:4px solid var(--acento);border-radius:12px;padding:12px 14px;margin-top:14px}
.nota-caixa p{margin:0}
.nota-caixa .fila{margin-top:10px}
.prioridades{white-space:pre-line}
/* liña do tempo */
.lt{list-style:none;padding:0;margin:0}
.lt li{display:grid;grid-template-columns:3.6rem 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--linha);cursor:pointer}
.lt .h{color:var(--suave);font-variant-numeric:tabular-nums;font-size:.95rem;padding-top:1px}
.lt .t{border-left:4px solid var(--c);padding-left:10px}
.lt .t small{display:block;color:var(--suave)}
.lt .t em{font-style:normal;color:var(--acento);font-size:.85rem}
.lt li.pasado{opacity:.48}
.lt li.actual .t{font-weight:700}
.lt li.marca-agora{display:flex;align-items:center;gap:10px;border:0;padding:4px 0;cursor:default;color:var(--acento);font-size:.85rem;font-weight:700}
.lt li.marca-agora::after{content:"";flex:1;height:2px;background:var(--acento);border-radius:1px}
.cancelados{margin:8px 0 0;color:var(--suave);font-size:.9rem}
.cancelados s{margin-right:8px}
/* tarefas */
.lista{list-style:none;padding:0;margin:0}
.tarefa{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--linha)}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c,var(--suave));background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check.feito{background:var(--c,var(--acento));border-color:var(--c,var(--acento))}
.check.feito::after{content:"";width:9px;height:14px;border:solid var(--superficie);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.tarefa .corpo{flex:1;min-width:0;cursor:pointer}
.tarefa .meta{color:var(--suave);font-size:.88rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tarefa.feita .tit{text-decoration:line-through;color:var(--suave)}
.atrasada{color:var(--perigo);font-weight:700}
.prio-alta{border-left:3px solid var(--perigo);padding-left:6px}
.grupo{margin:22px 0 4px;font-weight:700;color:var(--suave);font-size:.95rem}
.grupo.caixa{color:var(--acento)}
.rapida{display:flex;gap:8px;margin:10px 0 0}
.rapida input{flex:1;min-width:0}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini .btn{min-height:34px;padding:4px 10px;font-size:.88rem}
/* hábitos */
.habs-hoxe{display:flex;flex-wrap:wrap;gap:8px}
.hab-chip{--c:var(--acento);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:var(--superficie);border-radius:999px;padding:8px 14px;cursor:pointer}
.hab-chip.feito{background:var(--c);border-color:var(--c);color:#fff}
.hab{padding:14px 0;border-bottom:1px solid var(--linha);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.hab .nome{font-weight:700;cursor:pointer}
.hab .info{grid-column:2;color:var(--suave);font-size:.9rem}
.dias14{grid-column:2;display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.dias14 button,.dias14 span{width:18px;height:18px;border-radius:4px;background:var(--linha);border:0;padding:0}
.dias14 button{cursor:pointer}
.dias14 .ok{background:var(--c)}
.dias14 .libre{background:transparent;border:1px dashed var(--linha)}
.dias14 .hoxe{box-shadow:0 0 0 2px var(--tinta) inset}
/* semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.col{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.col.sel{border-color:var(--acento);box-shadow:0 0 0 2px var(--acento) inset}
.col-n{font-size:.85rem;font-weight:700}
.col.hoxe .col-n{color:var(--acento)}
.col-barra{position:relative;width:100%;height:170px;border-radius:6px;background:color-mix(in srgb,var(--linha) 45%,transparent)}
.col-barra i{position:absolute;left:3px;right:3px;border-radius:3px}
.escala{display:flex;justify-content:space-between;color:var(--suave);font-size:.75rem;margin:4px 2px 0}
.horas{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;color:var(--suave);font-size:.92rem}
.horas span{display:flex;align-items:center;gap:6px}
.barra-accions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
/* revisión */
.resumo{font-size:1.1rem;line-height:1.6;margin:6px 0 0}
.resumo b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:1.25em}
.barcat{display:grid;grid-template-columns:7rem 1fr 4rem;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.barcat .progreso{height:9px}
.barcat span:last-child{text-align:right;color:var(--suave)}
details{border-bottom:1px solid var(--linha);padding:10px 0}
summary{cursor:pointer;font-weight:700}
details p{margin:6px 0;white-space:pre-line}
/* controis */
.btn{border:1px solid var(--linha);background:var(--superficie);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn.primario{background:var(--acento);border-color:var(--acento);color:var(--superficie);font-weight:700}
.btn.perigo{color:var(--perigo);border-color:color-mix(in srgb,var(--perigo) 45%,transparent)}
.btn.ligazon{border:0;background:none;color:var(--acento);text-decoration:underline;padding-left:0}
.filtros{display:flex;gap:6px;margin:8px 0}
.filtros button{border:1px solid var(--linha);background:var(--superficie);border-radius:999px;padding:6px 14px;cursor:pointer}
.filtros button.sel{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--linha);background:var(--superficie);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{min-height:76px;resize:vertical}
label{display:block;margin:10px 0 0;font-size:.92rem;color:var(--suave)}
label>input,label>select,label>textarea{margin-top:4px;color:var(--tinta)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diasel,.opcions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.diasel label,.opcions label{margin:0}
.diasel input,.opcions input{position:absolute;opacity:0;pointer-events:none}
.diasel span,.opcions span{display:inline-block;min-width:42px;text-align:center;padding:7px 10px;border:1px solid var(--linha);border-radius:9px;cursor:pointer;color:var(--tinta);background:var(--superficie)}
.diasel input:checked+span,.opcions input:checked+span{background:var(--acento);border-color:var(--acento);color:var(--superficie);font-weight:700}
.diasel input:focus-visible+span,.opcions input:focus-visible+span{outline:3px solid var(--acento);outline-offset:2px}
.catfila{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin-top:8px}
.catfila input[type=color]{width:48px;height:42px;border:1px solid var(--linha);border-radius:10px;background:none;padding:2px}
.caixa-ax{background:var(--superficie);border:1px solid var(--linha);border-radius:16px;padding:14px 16px;margin-top:10px}
.caixa-ax p{margin:4px 0}
.fila{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.fila.centro{justify-content:center}
/* modal */
dialog{border:0;border-radius:18px;padding:0;background:var(--superficie);color:var(--tinta);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,20,25,.45)}
.mform{padding:18px 18px 16px;overflow:auto;max-height:calc(100dvh - 40px)}
.mform h2{margin:0 0 4px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:1.4rem}
.maccions{display:flex;gap:8px;margin-top:18px;align-items:center}
.maccions .sp{flex:1}
.erro{color:var(--perigo);min-height:1.2em;margin:8px 0 0}
/* nav e botón flotante */
nav.abas{position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--linha);display:flex;justify-content:center;padding:0 4px env(safe-area-inset-bottom,0px);z-index:5}
nav.abas button{flex:1;max-width:130px;border:0;background:none;padding:12px 2px 13px;cursor:pointer;color:var(--suave);font-size:.9rem;border-top:3px solid transparent}
nav.abas button.sel{color:var(--tinta);font-weight:700;border-top-color:var(--acento)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acento);color:var(--superficie);font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:6}
.toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--fondo);padding:12px 18px;border-radius:12px;max-width:min(92vw,460px);z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast b{display:block}
/* concentración */
.capa{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
#foco{--c:var(--acento);background:color-mix(in srgb,var(--c) 16%,var(--fondo))}
.foco-in{width:min(520px,100%);text-align:center}
.foco-in .cat{color:var(--suave);display:flex;gap:8px;align-items:center;justify-content:center}
.foco-in h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.2rem);margin:.3em 0 .2em;line-height:1.1}
.reloxo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:clamp(4.5rem,24vw,9rem);font-variant-numeric:tabular-nums;line-height:1;margin:.15em 0 .25em;letter-spacing:-.02em}
.foco-in .progreso{height:8px}
.foco-in .pausado{color:var(--suave);min-height:1.5em;margin:10px 0 0}
#resp{z-index:40;background:color-mix(in srgb,#4F8E92 18%,var(--fondo))}
.resp-in{text-align:center;display:grid;justify-items:center;gap:20px}
.circulo{width:140px;height:140px;border-radius:50%;background:color-mix(in srgb,#4F8E92 55%,transparent);transform:scale(1);transition:transform 4s ease-in-out;margin:60px 0}
.resp-txt{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2rem;margin:0;min-height:1.3em}
@media (prefers-reduced-motion:reduce){.circulo{transition:none!important;transform:none!important}}
.ritmo{display:grid;grid-template-columns:7.5rem 1fr 4.6rem;gap:10px;align-items:center;margin:7px 0;font-size:.92rem}
.ritmo .progreso{background:color-mix(in srgb,var(--c,var(--acento)) 14%,transparent)}
.ritmo .enx{height:9px}.ritmo .ani{height:4px;margin-top:3px}
.ritmo .ani i{background:color-mix(in srgb,var(--c,var(--acento)) 55%,var(--suave))}
.ritmo span:last-child{text-align:right;color:var(--suave);font-variant-numeric:tabular-nums}
.escala5 span{min-width:0;padding:7px 9px;font-size:.88rem}
.modelo{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.modelo small{display:block;color:var(--suave)}
.editando{background:color-mix(in srgb,var(--acento) 12%,var(--superficie));border:1px solid color-mix(in srgb,var(--acento) 35%,transparent);border-radius:16px;padding:14px 16px;margin-top:8px}
.editando p{margin:0}
/* ===== cor ===== */
:root[data-tema="lavanda"]{--acento:#6D4AFF;--fondo:#F3F0FF;--linha:#DED7F5}
:root[data-tema="oceano"]{--acento:#1662D8;--fondo:#EDF3FC;--linha:#D3DFF1}
:root[data-tema="maza"]{--acento:#D6334A;--fondo:#FFF1F0;--linha:#F2D8D6}
:root[data-tema="herba"]{--acento:#14805A;--fondo:#EDF7F1;--linha:#D2E7DA}
:root[data-tema="sol"]{--acento:#B85A00;--fondo:#FFF5E6;--linha:#F0E0C6}
@media (prefers-color-scheme:dark){
  :root[data-tema="lavanda"]{--acento:#A994FF;--fondo:#14111E;--superficie:#1E1A2B;--linha:#342D49}
  :root[data-tema="oceano"]{--acento:#7FB0FF;--fondo:#0F141D;--superficie:#18202D;--linha:#2A3547}
  :root[data-tema="maza"]{--acento:#FF8A96;--fondo:#1A1112;--superficie:#261A1C;--linha:#43292D}
  :root[data-tema="herba"]{--acento:#6FD3A5;--fondo:#0F1713;--superficie:#17221C;--linha:#29392F}
  :root[data-tema="sol"]{--acento:#FFB45C;--fondo:#19140D;--superficie:#241D14;--linha:#40331F}
}
.marca{color:var(--acento);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.45rem;letter-spacing:-.02em;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.marca>span>span{display:inline-block;transform:rotate(var(--r)) translateY(var(--y))}
.marca .esp{width:.28em}
.marca.orde>span>span{transform:none}
@media (prefers-reduced-motion:no-preference){.marca>span>span{transition:transform .8s cubic-bezier(.25,1.6,.4,1) var(--d)}}
.marca.grande{font-size:clamp(2.8rem,13vw,3.6rem);line-height:1;margin-bottom:12px}
.agora h2{font-weight:800;letter-spacing:-.025em}
.reloxo{font-weight:700}
h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acento);margin-right:8px;vertical-align:2px}
/* O momento de agora: o único elemento de cor plena */
.agora{position:relative;overflow:hidden;background:var(--c);border:0;color:#fff;box-shadow:0 14px 34px -16px var(--c)}
.agora::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-110px;border:34px solid rgba(255,255,255,.13);pointer-events:none}
.agora>*{position:relative}
.agora .cat,.agora .despois{color:rgba(255,255,255,.85)}
.agora .despois{border-top-color:rgba(255,255,255,.28)}
.agora .despois b{color:#fff}
.agora .punto{background:#fff}
.agora .progreso{background:rgba(255,255,255,.28)}
.agora .progreso i{background:#fff}
.agora .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.agora .btn.primario{background:#fff;border-color:#fff;color:var(--c)}
/* liña do tempo con cor de categoría */
.lt li{border-bottom:0;padding:4px 0}
.lt .t{background:color-mix(in srgb,var(--c) 11%,var(--superficie));border-left:5px solid var(--c);border-radius:4px 12px 12px 4px;padding:8px 12px}
.lt .h{padding-top:9px}
.lt li.actual .t{background:color-mix(in srgb,var(--c) 22%,var(--superficie))}
/* hábitos e tarefas */
.hab-chip{background:color-mix(in srgb,var(--c) 10%,var(--superficie))}
.nota-caixa{border-left-color:var(--acento);background:color-mix(in srgb,var(--acento) 6%,var(--superficie))}
.col.sel{background:color-mix(in srgb,var(--acento) 10%,var(--superficie))}
nav.abas button{border-top:0;border-radius:12px;margin:6px 2px;padding:8px 2px}
nav.abas button.sel{background:color-mix(in srgb,var(--acento) 14%,transparent);color:var(--acento)}
.filtros button.sel{background:var(--acento);border-color:var(--acento);color:var(--superficie)}
.resumo b{color:var(--acento)}
/* selector de cor */
.temas{display:flex;gap:8px;flex-wrap:wrap}
.tema{display:flex;align-items:center;gap:8px;border:1.5px solid var(--linha);background:var(--superficie);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer}
.tema i{width:26px;height:26px;border-radius:50%;background:var(--t)}
.tema.sel{border-color:var(--t);box-shadow:0 0 0 2px var(--t) inset;font-weight:700}
/* rachas compartidas */
.gcard{background:var(--superficie);border:1px solid var(--linha);border-radius:18px;padding:16px;margin-top:10px}
.gcard .pequeno{margin:10px 0 4px}
.gcab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gtit{font-size:1.1rem}
.gracha{text-align:center;min-width:70px}
.gracha span{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.3rem;line-height:1;color:var(--acento)}
.gracha small{color:var(--suave);font-size:.8rem}
.avatares{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;border:2px solid var(--c);color:var(--c);background:var(--superficie)}
.avatar.ok{background:var(--c);color:#fff}
.gfila{display:grid;grid-template-columns:6rem auto 1fr;gap:10px;align-items:center;margin-top:6px}
.gfila .dias14{flex-wrap:nowrap}
.gfila .dias14{grid-column:auto;margin:0}
.cab-dias .dias14 span{background:none!important;border:0;font-size:.7rem;color:var(--suave);text-align:center;line-height:18px}
.gnome{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hab-chip.compartido{--c:var(--acento);border-style:dashed}
.hab-chip.compartido.feito{border-style:solid}
.hab-chip small{opacity:.8;margin-left:4px}
.codigo{font-family:ui-monospace,monospace;font-size:1.15rem;letter-spacing:.12em}
.paso-num{display:flex;gap:8px;align-items:center;margin-top:6px}
.paso-num input{text-align:center;font-size:1.3rem;font-weight:700;max-width:110px}
.paso-num .btn{min-width:52px;font-size:1.4rem}
.fitos{display:flex;flex-wrap:wrap;gap:8px}
.fito{display:flex;align-items:baseline;gap:6px;background:var(--superficie);border:1px solid var(--linha);border-radius:999px;padding:6px 14px}
.fito b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;color:var(--acento);font-size:1.15rem}
.fito small{color:var(--suave)}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confeti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:caer 1.9s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes caer{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.pasos{list-style:none;padding:0;margin:6px 0 0}
.pasos li{display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--linha);padding:4px 0}
.paso{display:flex;gap:10px;align-items:center;margin:0;color:var(--tinta);font-size:1rem}
.paso input{width:20px;height:20px}
.paso input:checked+span{text-decoration:line-through;color:var(--suave)}
.pechar-fila{padding:8px 0;border-bottom:1px solid var(--linha)}
.pechar-fila>span{display:block;margin-bottom:4px}
.cant-pechar{display:flex;gap:6px;align-items:center;color:var(--tinta);font-size:.95rem;margin:4px 8px 4px 0}
.opcions .cant-pechar input{position:static;opacity:1;pointer-events:auto;width:80px;min-height:36px;padding:4px 8px}
.diario{list-style:none;padding:0;margin:0}
.diario li{padding:10px 0;border-bottom:1px solid var(--linha);cursor:pointer}
.diario small{display:block;color:var(--suave)}
.segmentos{display:inline-flex;background:var(--superficie);border:1px solid var(--linha);border-radius:999px;padding:3px;margin:8px 0 2px}
.segmentos button{border:0;background:none;border-radius:999px;padding:7px 16px;cursor:pointer;color:var(--suave)}
.segmentos button.sel{background:var(--acento);color:var(--superficie);font-weight:700}
.grade{position:relative;margin-top:4px}
.gh{position:absolute;left:0;right:0;border-top:1px dashed var(--linha)}
.gh span{position:absolute;top:-.65em;left:0;font-size:.75rem;color:var(--suave);background:var(--fondo);padding-right:4px;font-variant-numeric:tabular-nums}
.gb{position:absolute;display:flex;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,var(--superficie));border-left:5px solid var(--c);overflow:hidden;box-shadow:0 1px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.gb.arrastrando{box-shadow:0 8px 22px -6px color-mix(in srgb,var(--c) 60%,transparent);z-index:3;opacity:.95}
.gb-mover{flex:none;width:28px;border:0;background:none;color:var(--c);font-size:1.1rem;cursor:grab;touch-action:none;padding:0}
.gb-corpo{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 6px 10px 0;cursor:pointer;color:var(--tinta);line-height:1.2;display:flex;flex-direction:column;justify-content:flex-start}
.gb.curto .gb-corpo{padding:2px 6px 2px 0;justify-content:center}
.gb.curto .gb-corpo small{display:none}
.gb.curto .gb-estirar::after{display:none}
.gb:not(.curto) .gb-mover{align-self:flex-start;padding-top:6px}
.gb-corpo b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-corpo small{display:block;color:var(--suave);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-estirar{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.gb-estirar::after{content:"";position:absolute;left:50%;bottom:4px;width:28px;height:3px;margin-left:-14px;border-radius:2px;background:var(--c);opacity:.6}
.mes-cab,.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mes-cab span{text-align:center;font-size:.8rem;color:var(--suave);padding:4px 0}
.mc{min-height:62px;border:1px solid var(--linha);background:var(--superficie);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;overflow:hidden}
.mc.baleira{border:0;background:none;cursor:default}
.mc.pasado{opacity:.55}
.mc.hoxe{border-color:var(--acento);box-shadow:0 0 0 2px var(--acento) inset}
.mc.modelo{background:color-mix(in srgb,var(--acento) 12%,var(--superficie))}
.mc-n{font-weight:700;font-size:.9rem}
.mc-mod{font-size:.66rem;line-height:1.1;color:var(--acento);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-mod.cambio{color:var(--suave)}
.mc-p{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto;font-size:.7rem;color:var(--suave)}
.mc-p i{width:7px;height:7px;border-radius:50%}
#impresion{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}

  body{background:#fff!important;color:#000}
  #impresion{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #impresion h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:20pt;margin:0 0 4mm}
  .icols{display:grid;grid-template-columns:repeat(7,1fr);gap:2mm}
  .icn{font-weight:700;font-size:10pt;margin-bottom:1mm}
  .icc{position:relative;border-top:.3mm solid #ccc}
  .ih{position:absolute;left:0;right:0;border-top:.2mm dashed #ddd}
  .ih span{font-size:6pt;color:#999}
  .ib{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--c) 22%,#fff);border-left:1.2mm solid var(--c);border-radius:1.5mm;padding:.6mm 1mm;overflow:hidden;font-size:7pt;line-height:1.15}

}

.items li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linha)}

function revisarAvisos(){

/* ---------- cifrado do rexistro de ánimo ----------
   Os rexistros de enerxía e ánimo cífranse no dispositivo (AES-GCM) cunha chave
   derivada dunha frase que só sabe a persoa usuaria. Na base de datos só hai texto cifrado. */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { let t = ""; new Uint8Array(buf).forEach(c => t += String.fromCharCode(c)); return btoa(t); };
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let chaveAnimo = null, animoBloqueado = false;
const chaveAnimoLS = () => "rutinas:animo:" + (sesion ? sesion.user.id : "local");
async function derivarChave(frase, sal){
  const base = await crypto.subtle.importKey("raw", te.encode(frase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:sal, iterations:310000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]);
}
async function cifrarEstados(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, chaveAnimo, te.encode(JSON.stringify({ estados:E.estados, diario:E.diario })));
  E.animo = { sal:E.animo.sal, iv:b64(iv), datos:b64(ct) };
}
async function descifrarEstados(k){
  if (!E.animo.datos) return [];
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:deb64(E.animo.iv) }, k, deb64(E.animo.datos));
  return JSON.parse(td.decode(pt));
}
function aplicarPrivado(d){
  if (Array.isArray(d)){ E.estados = d; E.diario = E.diario || []; }
  else { E.estados = (d && d.estados) || []; E.diario = (d && d.diario) || []; }
}
async function abrirAnimo(){
  if (!E || !E.animo){ animoBloqueado = false; chaveAnimo = null; return; }
  try {
    const r = localStorage.getItem(chaveAnimoLS());
    if (!r) throw 0;
    const k = await crypto.subtle.importKey("raw", deb64(r), "AES-GCM", true, ["encrypt","decrypt"]);
    aplicarPrivado(await descifrarEstados(k));
    chaveAnimo = k; animoBloqueado = false;
  } catch { chaveAnimo = null; E.estados = []; E.diario = []; animoBloqueado = true; }
  if (UI.vista !== "login") render();
}
async function lembrarChaveNeste(k){ localStorage.setItem(chaveAnimoLS(), b64(await crypto.subtle.exportKey("raw", k))); }

   Táboas separadas (rut_grupos, rut_grupo_membros, rut_grupo_marcas): só se comparte
   o nome do hábito, o alcume e os días marcados. O resto da app segue sendo privado. */
const CORES_MEMBROS = ["#7C3AED","#2563EB","#15803D","#B45309","#BE185D","#0F766E","#DC2626","#4338CA","#A16207","#0369A1","#9333EA","#047857"];

const eu = () => sesion && sesion.user.id;
const marcou = (g, uid, k) => g.marcas.has(uid + "|" + k);

const unidoEn = m => isoData(new Date(m.unido));
const activosEn = (g, k) => g.membros.filter(m => unidoEn(m) <= k);

function rachaGrupo(g){

    const k = isoData(d);

      if (!act.length) break;

async function cargarGrupos(){

  })

    if (error){ toast("Non se puido desmarcar", error.message); cargarGrupos(); }

  if (error){ toast("Non se puido marcar", error.message); cargarGrupos(); return; }
  if (k === hoxeISO()){

/* ---------- ritmo: enerxía e ánimo ---------- */
const media = (arr, k) => arr.length ? arr.reduce((s, x) => s + x[k], 0) / arr.length : null;
const num1 = v => v.toFixed(1).replace(".", ",");
function analiseRitmo(){
  const desde = sumarDias(hoxeISO(), -30);
  const l = E.estados.filter(x => x.data >= desde);
  if (l.length < 5) return { total:l.length };
  const franxas = [["Mañá",360,720],["Mediodía",720,960],["Tarde",960,1200],["Noite",1200,1440]];
  const porFranxa = franxas.map(([n,a,z]) => { const g = l.filter(x => { const m = mins(x.hora); return m >= a && m < z; }); return { n, c:g.length, e:media(g,"enerxia"), a:media(g,"animo") }; });
  const porDia = ORDE.map(d => { const g = l.filter(x => new Date(x.data+"T00:00").getDay() === d); return { n:DIAS[d], c:g.length, e:media(g,"enerxia"), a:media(g,"animo") }; });
  const grupos = {};
  l.forEach(x => {
    const m = mins(x.hora);
    const b = bloquesDaData(x.data).find(b => mins(b.ini) <= m && m < mins(b.fin));
    (grupos[b ? b.cat : "_libre"] = grupos[b ? b.cat : "_libre"] || []).push(x);
  });
  const porCat = Object.entries(grupos).map(([k,g]) => ({ n: k === "_libre" ? "Tempo libre" : cat(k).nome, cor: k === "_libre" ? "#7C8B8F" : cat(k).cor, c:g.length, e:media(g,"enerxia"), a:media(g,"animo") }));
  return { total:l.length, porFranxa, porDia, porCat };
}
function filasRitmo(lista){
  return lista.filter(x => x.c).map(x => `<div class="ritmo" ${x.cor ? `style="--c:${x.cor}"` : ""}><span>${esc(x.n)}</span><div><div class="progreso enx"><i style="width:${x.e/5*100}%"></i></div><div class="progreso ani"><i style="width:${x.a/5*100}%"></i></div></div><span>${num1(x.e)} / ${num1(x.a)}</span></div>`).join("");
}
function frasesRitmo(r){
  const v = r.porFranxa.filter(x => x.c >= 2);
  if (v.length < 2) return "";
  const max = v.reduce((a,b) => b.e > a.e ? b : a), min = v.reduce((a,b) => b.e < a.e ? b : a);
  if (max.e - min.e < 0.4) return "<p>A túa enerxía é bastante estable ao longo do día.</p>";
  const en = { "Mañá":"pola mañá", "Mediodía":"ao mediodía", "Tarde":"pola tarde", "Noite":"pola noite" };
  const para = { "Mañá":"a mañá", "Mediodía":"o mediodía", "Tarde":"a tarde", "Noite":"a noite" };
  return `<p>Adoitas ter máis enerxía ${en[max.n]} e menos ${en[min.n]}. Cando poidas, reserva o máis esixente para ${para[max.n]} e deixa o rutineiro para ${para[min.n]}.</p>`;
}

/* ---------- avisos coa app pechada (Web Push) ---------- */
const pushActivo = () => localStorage.getItem("rutinas:push") === "1";
const pushPosible = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64aBytes(b){ const p = "=".repeat((4 - b.length % 4) % 4); const t = atob((b + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(t, c => c.charCodeAt(0)); }
async function activarPush(){
  if (!sb || !sesion){ toast("Necesitas entrar coa túa conta", "Os avisos coa app pechada usan a sincronización."); return; }
  if (!CONFIG.vapid){ toast("Falta a chave pública de avisos", "Énchea en CONFIG.vapid no ficheiro."); return; }
  if (!pushPosible()){ toast("Este navegador non admite avisos coa app pechada", "No iPhone ou iPad, abre O meu caos desde a icona da pantalla de inicio."); return; }
  const p = await Notification.requestPermission();
  if (p !== "granted"){ toast("Notificacións bloqueadas", "Permíteas nos axustes do navegador."); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64aBytes(CONFIG.vapid) });
    const j = sub.toJSON();
    const { error } = await sb.from("rut_subscricions").upsert({ endpoint:j.endpoint, user_id:sesion.user.id, sub:j, dispositivo:navigator.userAgent.slice(0,140) });
    if (error) throw error;
    localStorage.setItem("rutinas:push", "1");
    E.axustes.zona = ZONA; gardar();
    toast("Avisos activados", "Chegarán a este dispositivo aínda que a app estea pechada.");
  } catch (e){ toast("Non se puideron activar os avisos", e.message || String(e)); }
}
async function desactivarPush(){
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub){ if (sb) await sb.from("rut_subscricions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  } catch {}
  localStorage.removeItem("rutinas:push"); render();
  toast("Avisos desactivados neste dispositivo");
}

const accionsMover = t => `<button class="btn" data-acc="moverTarefa" data-id="${t.id}" data-k="0">Hoxe</button><button class="btn" data-acc="moverTarefa" data-id="${t.id}" data-k="1">Mañá</button><button class="btn" data-acc="moverTarefa" data-id="${t.id}" data-k="7">Nunha semana</button><button class="btn" data-acc="moverTarefa" data-id="${t.id}" data-k="sen">Sen data</button>`;

    ${deHoxe.length ? `<ul class="lista">${deHoxe.map(t => filaTarefa(t)).join("")}</ul>` : `<p class="vacio">Non tes nada pendente ${eHoxe ? "para hoxe" : "este día"}.</p>`}

    <form class="rapida" data-form="rapida"><input type="text" name="t" placeholder="Engadir tarefa ${eHoxe ? "para hoxe" : "a este día"}" aria-label="Nova tarefa"><button class="btn primario" type="submit">Engadir</button></form>

      if (!(habs.length && habsVisibles) && !grs.length) return "";
      const propios = habsVisibles ? habs.map(h => `<button class="hab-chip ${feitoH(h,iso)?"feito":""}" style="--c:${cat(h.cat).cor}" data-acc="habitoData" data-id="${h.id}" data-k="${iso}" data-modo="mais" aria-pressed="${feitoH(h,iso)}">${esc(h.nome)}${h.meta ? ` <small>${etiquetaCant(h, iso)}</small>` : ""}</button>`).join("") : "";
      const comp = grs.map(g => { const act = activosEn(g, iso), f = act.filter(m => marcou(g, m.user_id, iso)).length, meu = marcou(g, eu(), iso);
        return `<button class="hab-chip compartido ${meu?"feito":""}" data-acc="marcaGrupo" data-id="${g.id}" data-k="${iso}" aria-pressed="${meu}">${esc(g.nome)} <small>${f} de ${act.length}</small></button>`; }).join("");
      return `<h3>Hábitos ${eHoxe ? "de hoxe" : "deste día"}</h3><div class="habs-hoxe">${propios}${comp}</div>`;
    })()}

    ${bl.length ? `<ul class="lt">${lt}</ul>` : `<p class="vacio">Non hai bloques este día.</p>`}

    ${proximas.length ? `<h3>Nos próximos días</h3><ul class="lista">${proximas.map(t => filaTarefa(t)).join("")}</ul>` : ""}`;

const hhmm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
/* Horario da semana: columnas anchas, desprazamento horizontal no móbil */
const PXS = 0.62;
function horarioSemana(sel, hoxe){
  const todos = fonteTipo().bloques;
  const ini = Math.min(420, ...todos.map(b => Math.floor(mins(b.ini) / 60) * 60));
  const fin = Math.max(1380, ...todos.map(b => Math.ceil(mins(b.fin) / 60) * 60));
  const alto = (fin - ini) * PXS;
  let horas = "";
  for (let h = ini; h <= fin; h += 60) horas += `<span style="top:${(h - ini) * PXS}px">${pad(h / 60)}</span>`;
  let liñas = "";
  for (let h = ini; h <= fin; h += 60) liñas += `<i style="top:${(h - ini) * PXS}px"></i>`;
  const cols = ORDE.map(d => {
    const bl = bloquesDoDia(d), carrís = [], pos = new Map();
    bl.forEach(b => { let c = carrís.findIndex(f => f <= mins(b.ini)); if (c < 0){ c = carrís.length; carrís.push(0); } carrís[c] = mins(b.fin); pos.set(b.id, c); });
    const n = Math.max(1, carrís.length);
    const bloques = bl.map(b => {
      const i = mins(b.ini), f = mins(b.fin), h = (f - i) * PXS, c = pos.get(b.id);
      return `<button class="sb ${h < 30 ? "mini" : ""}" data-acc="editarBloqueTipo" data-id="${b.id}" style="--c:${cat(b.cat).cor};top:${(i - ini) * PXS}px;height:${Math.max(14, h - 2)}px;left:calc(${c * 100 / n}% + 2px);width:calc(${100 / n}% - 4px)" aria-label="${esc(b.titulo)}, de ${b.ini} a ${b.fin}">${h >= 16 ? `<b>${esc(b.titulo)}</b>` : ""}${h >= 44 ? `<small>${b.ini}–${b.fin}</small>` : ""}</button>`;
    }).join("");
    return `<div class="sc ${d === sel ? "sel" : ""} ${d === hoxe ? "hoxe" : ""}"><button class="sc-n" data-acc="dia" data-id="${d}" aria-pressed="${d === sel}">${DIAS[d]}</button><div class="sc-c" style="height:${alto}px">${liñas}${bloques}</div></div>`;
  }).join("");
  return `<div class="sh-wrap" id="horarioSemana"><div class="sh"><div class="sh-horas" style="height:${alto}px">${horas}</div>${cols}</div></div>
    <p class="pequeno" style="margin:4px 0 0">Desliza cara aos lados para ver toda a semana. Toca un bloque para editalo ou o nome dun día para velo en lista.</p>`;
}
function resumoActividades(){
  const g = {};
  fonteTipo().bloques.forEach(b => {
    const k = b.titulo.trim().toLowerCase(); if (!k) return;
    g[k] = g[k] || { nome:b.titulo.trim(), cat:b.cat, min:0, bloques:0 };
    g[k].min += Math.max(0, mins(b.fin) - mins(b.ini)) * b.dias.length; g[k].bloques++;
  });
  const l = Object.values(g).sort((a,b) => b.min - a.min);
  if (!l.length) return "";
  return `<details class="por-actividade"><summary>Horas á semana por actividade</summary>
    ${l.map(x => `<div class="barcat" style="--c:${cat(x.cat).cor}"><span>${esc(x.nome)}</span><div class="progreso"><i style="width:${x.min / l[0].min * 100}%"></i></div><span>${horasTxt(x.min)}</span></div>`).join("")}
    <p class="pequeno">Os bloques co mesmo nome cóntanse xuntos, aínda que sexan a horas distintas cada día.</p></details>`;
}
function selectorSemana(){
  const m = UI.semanaModo === "mes" ? "mes" : "tipo";
  return `<div class="segmentos" role="group" aria-label="Vista"><button data-acc="semanaModo" data-id="tipo" class="${m==="tipo"?"sel":""}" aria-pressed="${m==="tipo"}">Semana tipo</button><button data-acc="semanaModo" data-id="mes" class="${m==="mes"?"sel":""}" aria-pressed="${m==="mes"}">Mes</button></div>`;
}
/* Grade dun día con bloques que se poden arrastrar e estirar */
const PXM = 0.9;
function diaGrade(d){
  const bl = bloquesDoDia(d);
  const ini = Math.min(420, ...bl.map(b => Math.floor(mins(b.ini) / 60) * 60));
  const fin = Math.max(1380, ...bl.map(b => Math.ceil(mins(b.fin) / 60) * 60));
  const carrís = [], pos = new Map();
  bl.forEach(b => { let c = carrís.findIndex(f => f <= mins(b.ini)); if (c < 0){ c = carrís.length; carrís.push(0); } carrís[c] = mins(b.fin); pos.set(b.id, c); });
  const n = Math.max(1, carrís.length);
  let liñas = "";
  for (let h = ini; h <= fin; h += 60) liñas += `<div class="gh" style="top:${(h - ini) * PXM}px"><span>${pad(h / 60)}:00</span></div>`;
  const bloques = bl.map(b => {
    const c = pos.get(b.id), i = mins(b.ini), f = mins(b.fin);
    return `<div class="gb ${(f - i) * PXM < 44 ? "curto" : ""}" data-id="${b.id}" style="--c:${cat(b.cat).cor};top:${(i - ini) * PXM}px;height:${Math.max(22, (f - i) * PXM)}px;left:calc(3.2rem + (100% - 3.2rem) * ${c / n});width:calc((100% - 3.2rem) / ${n} - 4px)">
      <button class="gb-mover" aria-label="Mover ${esc(b.titulo)}">⠿</button>
      <button class="gb-corpo" data-acc="editarBloqueTipo" data-id="${b.id}"><b>${esc(b.titulo)}</b><small>${b.ini}–${b.fin}${b.dias.length > 1 ? `, tamén ${b.dias.filter(x => x !== d).sort((x,y) => ORDE.indexOf(x) - ORDE.indexOf(y)).map(x => DIAS_C[x]).join(" ")}` : ""}</small></button>
      <div class="gb-estirar" aria-hidden="true"></div>
    </div>`;
  }).join("");
  return `<div class="grade" data-ini="${ini}" style="height:${(fin - ini) * PXM + 8}px">${liñas}${bloques}</div>`;
}
let arrastre = null;
document.addEventListener("pointerdown", e => {
  const asa = e.target.closest(".gb-mover, .gb-estirar"); if (!asa) return;
  const gb = asa.closest(".gb"), b = fonteTipo().bloques.find(x => x.id === gb.dataset.id); if (!b) return;
  e.preventDefault(); try { asa.setPointerCapture(e.pointerId); } catch {}
  arrastre = { gb, b, modo: asa.classList.contains("gb-mover") ? "mover" : "estirar", y0:e.clientY, ini:mins(b.ini), fin:mins(b.fin), base:Number(gb.parentElement.dataset.ini) };
  gb.classList.add("arrastrando");
});
document.addEventListener("pointermove", e => {
  const a = arrastre; if (!a) return;
  const dm = Math.round((e.clientY - a.y0) / PXM / 15) * 15;
  let i = a.ini, f = a.fin;
  if (a.modo === "mover"){ i += dm; f += dm; if (i < 0){ f -= i; i = 0; } if (f > 1439){ i -= f - 1439; f = 1439; } }
  else f = Math.max(i + 15, Math.min(1439, f + dm));
  a.ni = i; a.nf = f;
  a.gb.style.top = `${(i - a.base) * PXM}px`; a.gb.style.height = `${Math.max(22, (f - i) * PXM)}px`;
  a.gb.querySelector("small").textContent = `${hhmm(i)}–${hhmm(f)}`;
});
function soltarArrastre(gardarCambios){
  const a = arrastre; if (!a) return; arrastre = null;
  a.gb.classList.remove("arrastrando");
  if (gardarCambios && a.ni != null && (a.ni !== a.ini || a.nf !== a.fin)){
    a.b.ini = hhmm(a.ni); a.b.fin = hhmm(a.nf); gardar();
    if (a.b.dias.length > 1) toast("Bloque cambiado", "Tamén nos outros días onde se repite.");
  } else render();
}
document.addEventListener("pointerup", () => soltarArrastre(true));
document.addEventListener("pointercancel", () => soltarArrastre(false));

/* Vista de mes */
function vistaMes(){
  const base = UI.mes || hoxeISO().slice(0, 7), [y, mo] = base.split("-").map(Number);
  const primeiro = new Date(y, mo - 1, 1), desfase = (primeiro.getDay() + 6) % 7, dias = new Date(y, mo, 0).getDate(), hk = hoxeISO();
  let celas = "";
  for (let i = 0; i < desfase; i++) celas += `<span class="mc baleira"></span>`;
  for (let n = 1; n <= dias; n++){
    const iso = `${y}-${pad(mo)}-${pad(n)}`, ex = E.excepcions[iso];
    const tar = E.tarefas.filter(t => t.data === iso && !t.feita);
    const puntos = tar.slice(0, 4).map(t => `<i style="background:${t.cat ? cat(t.cat).cor : "var(--suave)"}"></i>`).join("");
    const cambio = ex && ((ex.canceladas||[]).length || Object.keys(ex.mod||{}).length || (ex.extra||[]).length);
    celas += `<button class="mc ${iso===hk?"hoxe":""} ${iso<hk?"pasado":""} ${ex && ex.modelo?"modelo":""}" data-acc="irData" data-k="${iso}" aria-label="${n} de ${MESES[mo-1]}${tar.length?`, ${tar.length} tarefas`:""}${ex && ex.modelo?`, modelo ${esc(ex.modelo)}`:""}">
      <span class="mc-n">${n}</span>${ex && ex.modelo ? `<span class="mc-mod">${esc(ex.modelo)}</span>` : (cambio ? `<span class="mc-mod cambio">cambios</span>` : "")}<span class="mc-p">${puntos}${tar.length > 4 ? "+" : ""}</span></button>`;
  }
  const doMes = tarefasOrdenadas(E.tarefas.filter(t => t.data && t.data.startsWith(base) && !t.feita && t.data >= hk));
  return `<div class="navdia"><button class="btn" data-acc="moverMes" data-id="-1" aria-label="Mes anterior">‹</button><span class="etq">${MESES[mo-1].replace(/^./, c => c.toUpperCase())} ${y}</span><button class="btn" data-acc="moverMes" data-id="1" aria-label="Mes seguinte">›</button></div>
    <div class="mes-cab">${["L","M","M","X","V","S","D"].map(x => `<span>${x}</span>`).join("")}</div>
    <div class="mes">${celas}</div>
    <p class="pequeno">Toca un día para velo ou cambialo. Os puntos son tarefas; a etiqueta, un modelo de semana aplicado.</p>
    <h3>Que vén este mes</h3>
    ${doMes.length ? `<ul class="lista">${doMes.map(t => filaTarefa(t)).join("")}</ul>` : `<p class="vacio">Non tes tarefas con data o que queda de mes.</p>`}
    <div class="barra-accions"><button class="btn" data-acc="oTeuMes" data-id="${base}">Ver o resumo deste mes</button></div>`;
}

/* O teu mes: resumo e imaxe para gardar */
function datosMes(base){
  const [y, mo] = base.split("-").map(Number), dias = new Date(y, mo, 0).getDate(), hk = hoxeISO();
  const datas = []; for (let n = 1; n <= dias; n++){ const iso = `${y}-${pad(mo)}-${pad(n)}`; if (iso <= hk) datas.push(iso); }
  const porCat = {};
  datas.forEach(iso => bloquesDaData(iso).forEach(b => { porCat[b.cat] = (porCat[b.cat] || 0) + Math.max(0, mins(b.fin) - mins(b.ini)); }));
  const feitas = E.tarefas.filter(t => t.feita && t.feitaEn && t.feitaEn.startsWith(base)).length;
  let prog = 0, ok = 0, mellor = { n:0, nome:"" };
  E.habitos.forEach(h => {
    let run = 0;
    datas.forEach(iso => { if (!h.dias.includes(new Date(iso+"T00:00").getDay())) return; prog++; if (feitoH(h, iso)){ ok++; run++; if (run > mellor.n) mellor = { n:run, nome:h.nome }; } else run = 0; });
  });
  const foco = E.foco.filter(f => f.data.startsWith(base)).reduce((s, f) => s + f.min, 0);
  const est = (!animoBloqueado ? E.estados : []).filter(x => x.data.startsWith(base));
  const fitos = E.fitos.filter(f => f.data.startsWith(base));
  const diasCompletos = datas.filter(iso => { const hs = E.habitos.filter(h => h.dias.includes(new Date(iso+"T00:00").getDay())); return hs.length && hs.every(h => feitoH(h, iso)); }).length;
  return { y, mo, porCat, feitas, pc: prog ? Math.round(ok / prog * 100) : null, mellor, foco, enerxia: est.length ? media(est, "enerxia") : null, animo: est.length ? media(est, "animo") : null, fitos, diasCompletos, ndias: datas.length };
}
function oTeuMes(base){
  base = base || hoxeISO().slice(0, 7);
  const d = datosMes(base), nomeMes = `${MESES[d.mo-1]} de ${d.y}`;
  const cats = Object.entries(d.porCat).sort((a,b) => b[1] - a[1]), max = Math.max(1, ...cats.map(x => x[1]));
  abrirModal(`O teu ${MESES[d.mo-1]}`, `
    <p class="resumo">${d.feitas ? `Completaches <b>${d.feitas}</b> ${d.feitas===1?"tarefa":"tarefas"}` : "Este mes aínda non marcaches tarefas"}${d.pc !== null ? `, cumpriches o <b>${d.pc} %</b> dos hábitos` : ""}${d.foco ? ` e concentrácheste <b>${durTxt(d.foco)}</b>` : ""}.</p>
    ${d.mellor.n ? `<p>A túa mellor racha: <b>${d.mellor.n} días</b> con «${esc(d.mellor.nome)}».</p>` : ""}
    ${d.diasCompletos ? `<p>${d.diasCompletos} ${d.diasCompletos===1?"día":"días"} fixeches todos os teus hábitos.</p>` : ""}
    ${d.enerxia ? `<p>Enerxía media ${num1(d.enerxia)} e ánimo medio ${num1(d.animo)} sobre 5.</p>` : ""}
    ${d.fitos.length ? `<p>Fitos: ${d.fitos.map(f => `${f.dias} días de «${esc(f.nome)}»`).join(", ")}.</p>` : ""}
    ${cats.length ? `<div class="grupo">Onde foi o teu tempo planificado</div>${cats.map(([c, mn]) => `<div class="barcat" style="--c:${cat(c).cor}"><span>${esc(cat(c).nome)}</span><div class="progreso"><i style="width:${mn/max*100}%"></i></div><span>${horasTxt(mn)}</span></div>`).join("")}` : ""}`,
    () => { imaxeMes(d, nomeMes); return false; }, null, { textoGardar:"Gardar como imaxe" });
}
async function imaxeMes(d, nomeMes){
  try { await document.fonts.ready; } catch {}
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), st = getComputedStyle(document.documentElement);
  const acento = st.getPropertyValue("--acento").trim() || "#6D4AFF", fondo = st.getPropertyValue("--fondo").trim() || "#F3F0FF", tinta = st.getPropertyValue("--tinta").trim() || "#1D2B2F", suave = st.getPropertyValue("--suave").trim() || "#5F6F73";
  const DISP = '"Bricolage Grotesque", system-ui, sans-serif', TXT = '"Atkinson Hyperlegible", system-ui, sans-serif';
  x.fillStyle = fondo; x.fillRect(0, 0, W, H);
  x.fillStyle = acento; x.beginPath(); x.arc(W - 120, 110, 260, 0, Math.PI * 2); x.globalAlpha = .12; x.fill(); x.globalAlpha = 1;
  x.fillStyle = acento; x.font = `800 54px ${DISP}`; x.fillText("O meu caos", 80, 130);
  x.fillStyle = tinta; x.font = `800 96px ${DISP}`; x.fillText(nomeMes.replace(/^./, m => m.toUpperCase()), 80, 250);
  const datos = [[d.feitas, d.feitas === 1 ? "tarefa feita" : "tarefas feitas"], [d.pc !== null ? d.pc + " %" : "–", "dos hábitos"], [d.foco ? horasTxt(d.foco) : "0 h", "de concentración"], [d.mellor.n ? d.mellor.n + " días" : "–", "mellor racha"]];
  datos.forEach(([v, l], i) => {
    const cx = 80 + (i % 2) * 470, cy = 400 + Math.floor(i / 2) * 200;
    x.fillStyle = acento; x.font = `800 92px ${DISP}`; x.fillText(String(v), cx, cy);
    x.fillStyle = suave; x.font = `400 36px ${TXT}`; x.fillText(l, cx, cy + 52);
  });
  const cats = Object.entries(d.porCat).sort((a,b) => b[1] - a[1]).slice(0, 6), max = Math.max(1, ...cats.map(z => z[1]));
  x.fillStyle = tinta; x.font = `700 40px ${TXT}`; x.fillText("O teu tempo", 80, 780);
  cats.forEach(([ci, mn], i) => {
    const y0 = 830 + i * 64, k = cat(ci);
    x.fillStyle = tinta; x.font = `400 32px ${TXT}`; x.fillText(k.nome, 80, y0 + 28);
    x.fillStyle = k.cor; x.globalAlpha = .18; x.fillRect(330, y0 + 4, 560, 30); x.globalAlpha = 1; x.fillRect(330, y0 + 4, 560 * mn / max, 30);
    x.fillStyle = suave; x.fillText(horasTxt(mn), 910, y0 + 28);
  });
  if (d.mellor.n){ x.fillStyle = suave; x.font = `400 30px ${TXT}`; x.fillText(`Mellor racha: «${d.mellor.nome}»`.slice(0, 52), 80, 1300); }
  c.toBlob(async blob => {
    const nome = `o-meu-caos-${d.y}-${pad(d.mo)}.png`, ficheiro = new File([blob], nome, { type:"image/png" });
    if (navigator.canShare && navigator.canShare({ files:[ficheiro] })){ try { await navigator.share({ files:[ficheiro], title:"O meu caos" }); return; } catch (e){ if (e.name === "AbortError") return; } }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  }, "image/png");
}

/* Imprimir a semana tipo */
function imprimirSemana(){
  const bl = E.bloques;
  const ini = Math.min(420, ...bl.map(b => Math.floor(mins(b.ini) / 60) * 60));
  const fin = Math.max(1320, ...bl.map(b => Math.ceil(mins(b.fin) / 60) * 60));
  const alto = 165, esc_ = alto / (fin - ini);
  let horas = ""; for (let h = ini; h <= fin; h += 60) horas += `<div class="ih" style="top:${(h-ini)*esc_}mm"><span>${pad(h/60)}:00</span></div>`;
  const cols = ORDE.map(d => `<div class="ic"><div class="icn">${DIAS[d]}</div><div class="icc" style="height:${alto}mm">${horas}${bloquesDoDia(d).map(b => `<div class="ib" style="top:${(mins(b.ini)-ini)*esc_}mm;height:${(mins(b.fin)-mins(b.ini))*esc_}mm;--c:${cat(b.cat).cor}"><b>${esc(b.titulo)}</b><span>${b.ini}–${b.fin}</span></div>`).join("")}</div></div>`).join("");
  const usadas = E.categorias.filter(c => bl.some(b => b.cat === c.id));
  let z = document.getElementById("impresion");
  if (!z){ z = document.createElement("div"); z.id = "impresion"; document.body.appendChild(z); }
  z.innerHTML = `<h1>A miña semana</h1><div class="icols">${cols}</div><div class="ilenda">${usadas.map(c => `<span><i style="background:${c.cor}"></i>${esc(c.nome)}</span>`).join("")}</div>`;
  window.print();
}

function rangoTxt(a, z){
  const f = iso => { const d = new Date(iso+"T00:00"); return `${d.getDate()} de ${MESES[d.getMonth()]}`; };
  return a === z ? `o ${f(a)}` : `do ${f(a)} ao ${f(z)}`;
}
function seccionModelos(){
  const hk = hoxeISO(), aplicados = {};
  Object.entries(E.excepcions).filter(([k,x]) => x.modelo && k >= hk).forEach(([k,x]) => { (aplicados[x.modelo] = aplicados[x.modelo] || []).push(k); });
  const ap = Object.entries(aplicados).map(([n, ds]) => { ds.sort(); return `<li class="modelo"><span><b>${esc(n)}</b><small>${rangoTxt(ds[0], ds[ds.length-1])}</small></span><button class="btn" data-acc="quitarModelo" data-id="${esc(n)}">Quitar</button></li>`; }).join("");
  const lista = E.plantillas.map(p => {
    const tot = p.bloques.reduce((s,b) => s + Math.max(0, mins(b.fin) - mins(b.ini)) * b.dias.length, 0);
    return `<li class="modelo"><span data-acc="opcionsModelo" data-id="${p.id}" style="cursor:pointer"><b>${esc(p.nome)}</b><small>${p.bloques.length} bloques, ${horasTxt(tot)} á semana</small></span><span class="mini" style="margin:0"><button class="btn" data-acc="editarModelo" data-id="${p.id}">Editar</button><button class="btn primario" data-acc="aplicarModelo" data-id="${p.id}">Aplicar</button></span></li>`;
  }).join("");
  return `<h3>Modelos de semana</h3>
    <p class="vacio">Garda semanas distintas (exames, vacacións, concertos) e aplícaas a unhas datas sen tocar a túa semana tipo.</p>
    ${lista ? `<ul class="lista">${lista}</ul>` : ""}
    <div class="barra-accions"><button class="btn" data-acc="gardarModelo">Gardar a semana tipo como modelo</button><button class="btn" data-acc="novoModelo">Novo modelo baleiro</button></div>
    ${ap ? `<h3>Modelos aplicados</h3><ul class="lista">${ap}</ul>` : ""}`;
}

function vistaTarefas(){
  const f = UI.filtro;
  let lista = tarefasOrdenadas(E.tarefas.filter(t => f === "todas" || (f === "pend" ? !t.feita : t.feita)));
  const grupos = [
    ["Caixa de entrada", t => t.caixa && !t.data, "caixa"],
    ["Atrasadas", t => t.data && diasDesde(t.data) < 0 && !t.feita],
    ["Hoxe", t => t.data && diasDesde(t.data) === 0],
    ["Mañá", t => t.data && diasDesde(t.data) === 1],
    ["Esta semana", t => t.data && diasDesde(t.data) > 1 && diasDesde(t.data) <= 7],
    ["Máis adiante", t => t.data && diasDesde(t.data) > 7],
    ["Pasadas", t => t.data && diasDesde(t.data) < 0 && t.feita],
    ["Sen data", t => !t.data]
  ];
  const usadas = new Set();
  const html = grupos.map(([n, fn, cls]) => {
    const g = lista.filter(t => !usadas.has(t.id) && fn(t));
    g.forEach(t => usadas.add(t.id));
    if (!g.length) return "";
    const enCaixa = cls === "caixa";
    return `<div class="grupo ${cls||""}">${n}</div>${enCaixa ? `<p class="pequeno" style="margin:0">Dálle data a cada cousa ou bórraa.</p>` : ""}<ul class="lista">${g.map(t => filaTarefa(t, (enCaixa || n === "Atrasadas") && !t.feita ? accionsMover(t) : "")).join("")}</ul>`;
  }).join("");
  return `${seccionListas()}${sb && sesion && UI.gruposErro !== "falta-sql" ? `<h3>As túas tarefas</h3>` : ""}<div class="filtros" role="group" aria-label="Filtrar tarefas">${[["pend","Pendentes"],["feitas","Feitas"],["todas","Todas"]].map(([k,n])=>`<button data-acc="filtro" data-id="${k}" class="${f===k?"sel":""}" aria-pressed="${f===k}">${n}</button>`).join("")}</div>
    ${html || `<p class="vacio">${f==="feitas"?"Aínda non marcaches ningunha tarefa como feita.":"Non tes tarefas pendentes. Engade a primeira."}</p>`}
    <div class="barra-accions"><button class="btn primario" data-acc="novaTarefa">Engadir tarefa</button>${E.tarefas.some(t=>t.feita)?`<button class="btn" data-acc="limparFeitas">Borrar as feitas</button>`:""}</div>`;
}

    ${E.fitos.length ? `<h3>Fitos conseguidos</h3><div class="fitos">${E.fitos.slice().reverse().map(f => `<span class="fito"><b>${f.dias}</b> ${esc(f.nome)}<small>${esc(dataCurta(f.data))}</small></span>`).join("")}</div>` : ""}`;

function vistaRevision(){
  const hoxe = new Date(), chave = semanaISO(hoxe), r = E.revisions[chave] || {};
  const hk = hoxeISO(), desde = sumarDias(hk, -6);
  const feitas = E.tarefas.filter(t => t.feita && t.feitaEn && t.feitaEn >= desde && t.feitaEn <= hk).length;

  const foco = E.foco.filter(f => f.data >= desde);
  const focoTot = foco.reduce((s, f) => s + f.min, 0);
  const porCat = {}; foco.forEach(f => { porCat[f.cat] = (porCat[f.cat] || 0) + f.min; });

  const atrasadas = tarefasOrdenadas(E.tarefas.filter(t => !t.feita && t.data && diasDesde(t.data) < 0));

  const anteriores = Object.entries(E.revisions).filter(([k]) => k !== chave).sort((a,b) => b[0].localeCompare(a[0])).slice(0, 6);

  return `<button class="btn ligazon" data-acc="aba" data-id="semana">Volver á semana</button>

      const r = analiseRitmo();

    })()}

    ${animoBloqueado ? `<p class="vacio">O teu diario está pechado neste dispositivo.</p><div class="barra-accions"><button class="btn" data-acc="desbloquearAnimo">Abrilo</button></div>`

/* ---------- concentración e respiración ---------- */
function cargarFoco(){ try { UI.foco = JSON.parse(localStorage.getItem("rutinas:foco")); } catch { UI.foco = null; } }
function gardarFoco(){ if (UI.foco) localStorage.setItem("rutinas:foco", JSON.stringify(UI.foco)); else localStorage.removeItem("rutinas:foco"); }
const restante = () => UI.foco.pausa != null ? UI.foco.pausa : Math.max(0, UI.foco.fin - Date.now());
function iniciarFoco(titulo, c, min){
  UI.foco = { titulo, cat:c, total:min, fin:Date.now() + min*60000, pausa:null };
  gardarFoco(); pintarFoco();
}
function pintarFoco(){
  const o = $("#foco");
  if (!UI.foco){ o.hidden = true; o.innerHTML = ""; clearInterval(focoTick); focoTick = null; return; }
  const f = UI.foco, c = cat(f.cat);
  o.style.setProperty("--c", c.cor);
  o.hidden = false;
  o.innerHTML = `<div class="foco-in" role="dialog" aria-label="Modo concentración">
    <p class="cat"><span class="punto"></span>${esc(c.nome)}</p>
    <h2>${esc(f.titulo)}</h2>
    <div class="reloxo" id="reloxo"></div>
    <div class="progreso"><i id="focobarra"></i></div>
    <p class="pausado" id="pausado"></p>
    <div class="fila centro"><button class="btn" data-acc="focoPausa" id="focoPausa"></button><button class="btn primario" data-acc="focoRematar">Rematar</button></div>
    <div class="fila centro"><button class="btn ligazon" data-acc="respirar">Respirar un minuto</button></div>
  </div>`;
  actualizarReloxo();
  if (!focoTick) focoTick = setInterval(() => {
    if (!UI.foco) return;
    if (UI.foco.pausa == null && restante() <= 0) completarFoco(true);
    else actualizarReloxo();
  }, 1000);
}
function actualizarReloxo(){
  if (!UI.foco || !$("#reloxo")) return;
  const r = restante(), s = Math.ceil(r / 1000);
  $("#reloxo").textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`;
  $("#focobarra").style.width = `${100 - r / (UI.foco.total*60000) * 100}%`;
  $("#focoPausa").textContent = UI.foco.pausa != null ? "Continuar" : "Pausar";
  $("#pausado").textContent = UI.foco.pausa != null ? "En pausa" : "";
  document.title = `${pad(Math.floor(s/60))}:${pad(s%60)} · O meu caos`;
}
function completarFoco(completo){
  const f = UI.foco; if (!f) return;
  const min = completo ? f.total : Math.round((f.total*60000 - restante()) / 60000);
  UI.foco = null; gardarFoco(); pintarFoco(); document.title = "O meu caos";
  if (min >= 1) E.foco.push({ data:hoxeISO(), min, cat:f.cat, titulo:f.titulo });
  gardar();
  if (completo){ son(); avisar("Sesión rematada", `${durTxt(min)} de concentración. Levántate, bebe auga e estira un pouco.`); }
  else if (min >= 1) toast("Sesión gardada", `${durTxt(min)} de concentración.`);
}
function respirar(){
  const o = $("#resp");
  clearTimeout(respT);
  o.hidden = false;
  o.innerHTML = `<div class="resp-in" role="dialog" aria-label="Respiración"><div class="circulo" id="circ"></div><p class="resp-txt" id="rtxt" aria-live="polite">Ponte cómodo</p><p class="pequeno" id="rciclo"></p><button class="btn" data-acc="pecharResp">Pechar</button></div>`;
  const fases = [["Inspira", 4000, 1.6], ["Mantén", 2000, 1.6], ["Expira", 6000, 1]];
  let ciclo = 0, i = 0;
  const paso = () => {
    if (o.hidden) return;
    if (ciclo >= 5){ $("#rtxt").textContent = "Ben feito"; $("#rciclo").textContent = ""; return; }
    const [t, ms, esc_] = fases[i];
    $("#rtxt").textContent = t;
    $("#rciclo").textContent = `Respiración ${ciclo + 1} de 5`;
    const c = $("#circ"); c.style.transitionDuration = ms + "ms"; c.style.transform = `scale(${esc_})`;
    i++; if (i === fases.length){ i = 0; ciclo++; }
    respT = setTimeout(paso, ms);
  };
  respT = setTimeout(paso, 1200);
}

/* ---------- formularios ---------- */
function abrirModal(titulo, corpo, onGardar, onBorrar, opts = {}){
  const d = $("#modal");
  d.innerHTML = `<form class="mform"><h2>${esc(titulo)}</h2>${corpo}<p class="erro" id="merro" role="alert"></p>
    <div class="maccions">${onBorrar?`<button type="button" class="btn perigo" data-m="borrar">${opts.textoBorrar || "Borrar"}</button>`:""}<span class="sp"></span><button type="button" class="btn" data-m="cancelar">Cancelar</button><button type="submit" class="btn primario">${opts.textoGardar || "Gardar"}</button></div></form>`;
  const f = d.querySelector("form");
  f.onsubmit = e => { e.preventDefault(); const r = onGardar(f); if (r === true) d.close(); else if (typeof r === "string") $("#merro").textContent = r; };
  f.querySelector('[data-m="cancelar"]').onclick = () => d.close();
  if (onBorrar) f.querySelector('[data-m="borrar"]').onclick = () => { if (confirm(opts.confirmar || "Seguro que queres borralo?")){ onBorrar(f); d.close(); } };
  if (opts.trasAbrir) opts.trasAbrir(f);
  d.showModal();
  const p = f.querySelector("input[type=text]"); if (p && !p.value) p.focus();
}
const optsCat = (sel, baleiro) => (baleiro ? `<option value="">Sen categoría</option>` : "") + E.categorias.map(c => `<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nome)}</option>`).join("");
const selDias = sel => `<div class="diasel">${ORDE.map(d => `<label><input type="checkbox" name="dias" value="${d}" ${sel.includes(d)?"checked":""}><span>${DIAS_C[d]}</span></label>`).join("")}</div>`;
const diasForm = f => [...f.querySelectorAll('input[name="dias"]:checked')].map(i => Number(i.value));
const valorRadio = (f, n) => (f.querySelector(`input[name="${n}"]:checked`) || {}).value;

/* Editar un bloque. iso = data concreta (desde Hoxe) ou null (semana tipo). */
function editarBloque(id, iso){
  const extra = iso ? (E.excepcions[iso]?.extra || []).find(b => b.id === id) : null;
  const fonte = iso ? E : fonteTipo();
  const tipo = fonte.bloques.find(b => b.id === id);
  const novo = !extra && !tipo;
  const diaSemana = iso ? new Date(iso+"T00:00").getDay() : UI.dia;
  const mod = iso && tipo ? (E.excepcions[iso]?.mod || {})[id] : null;
  const b = extra || (tipo ? { ...tipo, ...(mod || {}) } : { id:uid(), dias:[diaSemana], ini:"09:00", fin:"10:00", titulo:"", cat:E.categorias[0].id, notas:"" });
  const conAlcance = iso && !extra;
  const etData = iso ? dataCurta(iso).toLowerCase() : "";
  const alcance = conAlcance ? `<label>Aplicar a</label><div class="opcions">
      <label><input type="radio" name="alcance" value="dia" checked><span>Só ${etData === "hoxe" || etData === "mañá" || etData === "onte" ? etData : "o " + esc(etData)}</span></label>
      <label><input type="radio" name="alcance" value="sempre"><span>Todas as semanas</span></label></div>` : "";
  abrirModal(novo ? "Novo bloque" : "Editar bloque", `
    ${alcance}
    <label>Que vas facer<input type="text" name="titulo" value="${esc(b.titulo)}" required list="nomesBloques" autocomplete="off"></label>
    <datalist id="nomesBloques">${[...new Set(E.bloques.concat(...E.plantillas.map(p => p.bloques)).map(x => x.titulo.trim()).filter(Boolean))].map(t => `<option value="${esc(t)}">`).join("")}</datalist>
    <p class="pequeno" style="margin:4px 0 0">Usa o mesmo nome noutros bloques e as horas cóntanse xuntas.</p>
    <label>Categoría<select name="cat">${optsCat(b.cat)}</select></label>
    <div class="duas"><label>Comeza<input type="time" name="ini" value="${b.ini}" required></label><label>Remata<input type="time" name="fin" value="${b.fin}" required></label></div>
    <div id="camposDias"><label>Días</label>${selDias(b.dias || [diaSemana])}</div>
    <label>Notas<textarea name="notas">${esc(b.notas)}</textarea></label>`,
    f => {
      const ini = f.ini.value, fin = f.fin.value;
      if (mins(fin) <= mins(ini)) return "A hora de remate ten que ser posterior á de comezo (os bloques non poden pasar da medianoite).";
      const datos = { titulo:f.titulo.value.trim(), cat:f.cat.value, ini, fin, notas:f.notas.value.trim() };
      const al = conAlcance ? valorRadio(f, "alcance") : (extra ? "dia" : "sempre");
      if (al === "dia"){
        const ex = excepcion(iso);
        if (extra) Object.assign(extra, datos);
        else if (novo) ex.extra.push({ id:b.id, ...datos });
        else ex.mod[id] = datos;
      } else {
        const dias = diasForm(f);
        if (!dias.length) return "Escolle polo menos un día.";
        if (novo) fonte.bloques.push({ id:b.id, dias, ...datos });
        else { Object.assign(tipo, datos, { dias }); if (iso && E.excepcions[iso]?.mod) delete E.excepcions[iso].mod[id]; }
      }
      gardar(); return true;
    },
    novo ? null : f => {
      const al = conAlcance ? valorRadio(f, "alcance") : (extra ? "dia" : "sempre");
      if (extra){ const ex = excepcion(iso); ex.extra = ex.extra.filter(x => x.id !== id); }
      else if (al === "dia"){ const ex = excepcion(iso); if (!ex.canceladas.includes(id)) ex.canceladas.push(id); delete ex.mod[id]; }
      else fonte.bloques = fonte.bloques.filter(x => x.id !== id);
      gardar();
    },
    {
      textoBorrar: conAlcance ? "Quitar" : "Borrar",
      confirmar: conAlcance ? "Quitar este bloque? Se escolliches «Todas as semanas», bórrase da semana tipo." : "Seguro que queres borralo?",
      trasAbrir: f => {
        const cd = f.querySelector("#camposDias");
        const actualizar = () => { cd.hidden = conAlcance ? valorRadio(f, "alcance") === "dia" : !!extra; };
        f.querySelectorAll('input[name="alcance"]').forEach(r => r.addEventListener("change", actualizar));
        actualizar();
      }
    });
}
function editarTarefa(t, base = {}){
  const novo = !t;
  t = t || { id:uid(), titulo:"", cat:"", data:hoxeISO(), hora:"", prio:"media", aviso:"", repetir:"", feita:false, notas:"", ...base };
  abrirModal(novo ? "Nova tarefa" : "Editar tarefa", `
    <label>Tarefa<input type="text" name="titulo" value="${esc(t.titulo)}" required></label>
    <div class="duas"><label>Data<input type="date" name="data" value="${t.data||""}"></label><label>Hora<input type="time" name="hora" value="${t.hora||""}"></label></div>
    <div class="duas"><label>Prioridade<select name="prio">${[["alta","Alta"],["media","Media"],["baixa","Baixa"]].map(([v,n])=>`<option value="${v}" ${t.prio===v?"selected":""}>${n}</option>`).join("")}</select></label>
    <label>Categoría<select name="cat">${optsCat(t.cat, true)}</select></label></div>
    <div class="duas"><label>Repetir<select name="repetir">${REPETIR.map(([v,n])=>`<option value="${v}" ${(t.repetir||"")===v?"selected":""}>${n}</option>`).join("")}</select></label>
    <label>Aviso<select name="aviso">${[["","Sen aviso"],["0","Á hora"],["15","15 min antes"],["60","1 hora antes"],["1440","O día anterior"],["10080","Unha semana antes"]].map(([v,n])=>`<option value="${v}" ${String(t.aviso)===v?"selected":""}>${n}</option>`).join("")}</select></label></div>
    <label>Pasos (opcional)</label>
    <ul class="pasos" id="pasosLista"></ul>
    <div class="rapida" style="margin-top:6px"><input type="text" id="pasoNovo" placeholder="Engadir un paso pequeno" aria-label="Novo paso"><button type="button" class="btn" id="pasoEngadir">Engadir</button></div>
    <label>Notas<textarea name="notas">${esc(t.notas)}</textarea></label>`,
    f => {
      if (f.repetir.value && !f.data.value) return "Para repetir unha tarefa, ponlle unha data de inicio.";
      t.pasos = f._pasos;
      Object.assign(t, { titulo:f.titulo.value.trim(), data:f.data.value, hora:f.hora.value, prio:f.prio.value, cat:f.cat.value, repetir:f.repetir.value, aviso:f.aviso.value === "" ? "" : Number(f.aviso.value), notas:f.notas.value.trim() });
      if (t.data) t.caixa = false;
      if (novo) E.tarefas.push(t);
      gardar(); return true;
    },
    novo ? null : () => { E.tarefas = E.tarefas.filter(x => x.id !== t.id); gardar(); },
    { trasAbrir: f => {
      f._pasos = (t.pasos || []).map(x => ({ ...x }));
      const lista = f.querySelector("#pasosLista"), inp = f.querySelector("#pasoNovo");
      const pintar = () => {
        lista.innerHTML = f._pasos.map((x, i) => `<li><label class="paso"><input type="checkbox" data-i="${i}" ${x.feito?"checked":""}><span>${esc(x.texto)}</span></label><button type="button" class="btn ligazon" data-quitar="${i}" aria-label="Quitar paso">Quitar</button></li>`).join("");
        lista.querySelectorAll("input[data-i]").forEach(c => c.onchange = () => { f._pasos[c.dataset.i].feito = c.checked; });

const ICONA_MIC = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const voz = () => window.SpeechRecognition || window.webkitSpeechRecognition;
let recoñecemento = null;
function ditar(campo, info, boton, idioma){
  const SR = voz(); if (!SR) return;
  if (recoñecemento){ recoñecemento.stop(); return; }
  const r = new SR(); recoñecemento = r;
  r.lang = idioma || "gl-ES"; r.interimResults = true; r.continuous = false;
  const base = campo.value ? campo.value.trim() + " " : "";
  boton.classList.add("gravando"); info.textContent = "Escoitando… fala cando queiras.";
  r.onresult = e => { campo.value = base + [...e.results].map(x => x[0].transcript).join(""); };
  r.onerror = e => {
    recoñecemento = null; boton.classList.remove("gravando");
    if ((e.error === "language-not-supported" || e.error === "bad-grammar") && r.lang === "gl-ES") return ditar(campo, info, boton, "es-ES");
    info.textContent = e.error === "not-allowed" ? "Permite o micrófono nos axustes do navegador." : e.error === "no-speech" ? "Non se oíu nada. Proba outra vez." : "Non se puido ditar. Podes usar o micrófono do teclado.";
  };
  r.onend = () => { recoñecemento = null; boton.classList.remove("gravando"); if (info.textContent.startsWith("Escoitando")) info.textContent = campo.value ? "Revisa o texto e preme Apuntar." : ""; };
  try { r.start(); } catch { recoñecemento = null; boton.classList.remove("gravando"); }
}
function prepararFoco(idBloque){

function pecharDia(){
  const hk = hoxeISO(), dw = new Date().getDay();
